$kind: collection
name: SmartPark API
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{accessToken}}'
variables:
  - key: baseUrl
    value: 'http://localhost:8080'
  - key: username
    value: admin
  - key: password
    value: smartpark-demo
  - key: lotId
    value: CENTRAL
  - key: accessToken
    value: ''
